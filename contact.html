<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal | Contact</title>
    <meta
      name="description"
      content="Contact the Student Portal team or support desk."
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container" aria-label="Main navigation">
        <div class="brand">SBUP Student Portal</div>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="contact.html" class="active">Contact</a>
        </div>
      </nav>
  
    </header>

    <main class="container section">
      <div class="contact-layout">
        <div>
          <h1>Contact Us</h1>
          <p>
            If you need academic support, have a question, or want to know more
            about the portal, please reach out using the form.
          </p>

          <div class="info-box">
            <p><strong>Email:</strong> contact@sbup.edu</p>
            <p><strong>Office Hours:</strong> 9:00 AM - 5:00 PM</p>
          </div>
        </div>

        <form id="contactForm" class="contact-form" novalidate>
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" />

          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
          />

          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="Type your message here"
          ></textarea>

          <button type="submit" class="button primary">Send Message</button>
          <p id="formMessage" class="form-message" aria-live="polite"></p>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© 2026 Student Portal | SBUP</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
